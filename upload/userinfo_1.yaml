#                  value:
#                    {"userinfo": "eyJraWQiOiJrR0NYbE9kNldFUkg5WWxrUzAxUFpjdmQ4dUplVl9FTTNvdXFlSVZCQWZVIiwidHlwIjoiSldUIiwiYWxnIjoiUlMyNTYifQ..gZiGfmO4scZi47QoYjE_vSSbKsSyZen9kBqcgJkVU4M7kZeOMl_k-NeHxQ1ybZB7nOmanhwYFy-AK4deN3TXP2BRdHnIj2TjafWuMDupDWb7WafSyvvC4bl2J-PBWr23Kw6uhRcXzm8dYeMQDE-w2V9hN_fn2DNMuEswwuWeWinBVnEcJvo1UJFj6g30EbUaG9KEyJqYYAaTDVgn5hakWFArrOSwSVzdGndUNQrSqaXi1k6VySJvS_hk8n88y1o1-ORhUAxBVBPmUgpzvAPjE4qSQqXoPpVeD2zwoDBs-NG62PpaVBi44lSJ3rLvCg5gFQTCGY6pVcNFpodEvvV1Ew"}
        '400':
          description: Bad Request.  Check the input parameters and values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: Unauthorized Request.  Check the authentication scheme and values being used to make the request.
          content:

#            "email_verified": true,
            "payment_accounts": {
                "accounts": "1000000690, 1000013781, 1000012893, 1000013754, 1000012953, 1000013734",
                "permits": [
                  {
                    "permitNumber": "3001",
                    "permitZIP": "101500957"
                  }
                ]
            },

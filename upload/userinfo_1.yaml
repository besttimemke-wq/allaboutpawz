paths:

  /userinfo:
    summary: 'Get claims for resource owner.'
    description: |
      Based on the \'OAuth 2.0 Token Revocation\', IETF Draft RFC 7009, August 2013, see [IETF 7009](https://datatracker.ietf.org/doc/html/rfc7009).
      
      
          Must use the Bearer authentication scheme.
    get:
      summary: 'Get claims for resource owner.'
      description: |
        Get user account profile information. Based on the \'OpenID Connect Core 1.0\', Final, November 2014, see [OpenID Foundation](https://openid.net/specs/openid-connect-core-1_0.html#UserInfo).  For userinfo, see https://openid.net/specs/openid-connect-core-1_0.html#UserInfo.
        
       
        Must use the Bearer authentication scheme.
           
         ```
         Authorization: Bearer eyJhbGciOiJSUzI1NiJ9..qJ2SUGKn4TabFfMYODW1RLxirFmeeYPDyFvuJR0ywRVaRnoe7Rlk8yKM3v2fCBUi2lMo00whNhNWmqQktpGgvkVGWXGMNIlVxJCqt_aPFx3oOvkhKWGI49JI5NyXrpj4tfYD5pIYbrihkF7eMYG3XyqYMx1VLhhV0PmWhpq787K7_AGfRlNVQnD_WEHJt4SoEnsiw8vcwDWXcXr5yCzAEn8mfCSTlamqVBUyey1Fyg_xgQIRj_b9CO-O4kXsBM3vqo5CO2qET2tRd37niaQvV-g418sEpnw1iAtxWfcyU4IIjWlQa7AxAc3T4Vx6XOwn1CNI22ZhdaBskUtD-EexWQ

         ```
       
      tags:
        - 'Resources'
      operationId: get-user-profile
      security:
      - OAuth:
        - oauth2-oidc
        - openid
        - profile
        - address
        - email
        - usps:payment_methods
        - usps:contract_rates
        - usps:MIDs
        
      responses:
        '200':
          description: 'Successful Operation. No response payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOwnerClaims'
              examples:
                userInfoResponse:
                  $ref: '#/components/examples/userInfoJSONResponse'

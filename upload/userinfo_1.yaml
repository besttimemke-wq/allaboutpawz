components:
  headers:
    RetryAfter:
      description: Indicate to the client application a time after which they can retry a resource request.
      schema:
        type: string
        example: 'Retry-After: 30'
      required: false
      
    WWWAuthenticate:
       description: Hint to the client application which security scheme to authorize a resource request.
       schema:
         type: string
         example: 'WWW-Authenticate: Bearer realm="https://api.usps.com"'
       required: false
       
  securitySchemes:
    OAuth:
      type: oauth2
      description: The specified APIs accept an access token placed in the Authorization header using the Bearer Authentication security scheme. The relative path to the OAuth2 API which supply this access token is provided here for reference.
      
        Access tokens issued by either the OAuth __Client Credentials__ or __Authorization Code__ flows are supported.
        
        The 'openid' scope is required either as an input or assigned to the client applicatiion upoon registration.
        
      flows:
        clientCredentials:
          tokenUrl: /oauth2/v3/token
          scopes:
            openid: OpenID Connnect industry standard scope to utilize this API.
            profile: The OpenID Connect industry standard, United States Postal Service authorized access the user's name and company.
            address: The OpenID Connect industry standard, United States Postal Service authorized access the user's address.
            email: The OpenID Connect industry standard, United States Postal Service authorized access the user's email address. 
            usps:payment_methods: United States Postal Service authorized access to the user's payment methods.
            usps:contract_rates: United States Postal Service authorized access to the user's contract rates.
            usps:MIDs: United States Postal Service authorized access to the user's mailer IDs.
        authorizationCode:
          authorizationUrl: /oauth2/v3/authorize
          tokenUrl: /oauth2/v3/token
          scopes:
            openid: OpenID Connnect industry standard scope to utilize this API.
            profile: The OpenID Connect industry standard, United States Postal Service authorized access the user's name and company.
            address: The OpenID Connect industry standard, United States Postal Service authorized access the user's address.
            email: The OpenID Connect industry standard, United States Postal Service authorized access the user's email address. 
            usps:payment_methods: United States Postal Service authorized access to the user's payment methods.
            usps:contract_rates: United States Postal Service authorized access to the user's contract rates.
            usps:MIDs: United States Postal Service authorized access to the user's mailer IDs.
      
  schemas:


    StandardClaims:
      title: IANA Registered, Standard Claims
      description: Claims collected and assertions made about an authenticated user and USPS customer. Industry-standard claims whose names are officially registered in Internet Assigned Numbers Authority (IANA) for OpenID Connect use.
      readOnly: true
      type: object
      properties:
# The following fields are mapped to the profile OAuth scope.
        sub:
          description:  The unique identifier of the user's account.
          type: string
# Profile details are not currently returned.
#        given_name:
#          description: The user's given or first name(s).
#          type: string
#        family_name:
#          description: The user's surname or last name(s).
#          type: string
#        preferred_username:
#          description: The user's preferred user name. The shorthand name by which the user wishes to be referred to.
#          type: string
#  Not supporting viewing the user's profile page at the USPS.
#        profile:
#          description: The URL to the user's profile web page.
#          type: string
#          format: Url
        updated_at:
          description:  The date and time that the user's account information has been updated.
          type: string
          format: date
# The following fields are mapped to the email OAuth scope.  They are not currently returned.
#        email:
#          description: The user's preferred email address.
#          type: string
#        email_verified:
#          description: Affirmative steps have been taken to ensure that this e-mail address was controlled by the End-User at the time the verification was performed. True if the user's e-mail address has been verified; otherwise false.
#          type: boolean
# The following fields are mapped to the phone OAuth scope.
#  Not supporting viewing the user's phone at the USPS.
#        phone_number:
#          description: The user's preferred telephone number.
#          type: string
#        phone_number_verified:
#          description: Affirmative steps have been taken to ensure that this phone number was controlled by the End-User at the time the verification was performed. True if the user's phone number has been verified; otherwise false
#          type: boolean
# The following fields are mapped to the address OAuth scope.  The sub-fields are USPS-specific.
# Address is not currently returned.
#        address:
#          $ref: '#/components/schemas/DomesticAddress'
      additionalProperties: true
      
    AdditionalClaims:
      title: Additional Claims
      description: Claims collected and assertions made about an authenticated user and USPS customer. Additional, USPS-specific claims collected and asserted about a USPS customer.
      readOnly: true
      type: object
      properties:
#  The following is mapped to the payment_methods OAuth scope.
        payment_accounts:
          description: A list of payment accounts which have been authorized by the USPS customer for use by the third-party application for payment of USPS goods and services. An EPS payment account or a permit may be used for payment.
          type: object
          properties:
            accounts:
              $ref: '#/components/schemas/Accounts'
            permits:
              $ref: '#/components/schemas/Permits'
          additionalProperties: false
# The following is mapped to the contract_rates Oauth scope.  Contracts are not currently returned.
#        contracts:
#          type: object
#          description: A list of identifiers which have been authorized by the USPS customer for use by the third-party application to access and use contract rates for USPS services. Contract rates are associated with a USPS Negotiated Service Agreement(NSA).
#          properties:
#            paymentAccounts:
#              description: A list of EPS payment account identifiers.
#              type: object
#              properties:
#                accounts:
#                  $ref: '#/components/schemas/Accounts'
#            permits:
#              $ref: '#/components/schemas/Permits'
#          additionalProperties: false
# The following is mapped to the MIDs OAuth scope.
        mail_owners:
          description: The mail owner claims belonging to the resource owner/user.
          type: array
          items:
            type: object
            properties:
              crid:
                $ref: '#/components/schemas/CRID'
              mids:
                description: A list of comma and space separated mailer Identifiers.
                type: string
            additionalProperties: false
      additionalProperties: true
    ResourceOwnerClaims:
      title: Resource Owner/User Claims
      description: The claims collected for the user when they have authorized access to a third-party client application.
        The claims collected for each application may be unique, based on default and optional claims.
      readOnly: true
      required:
        - sub
      allOf:
        - $ref: '#/components/schemas/StandardClaims'
        - $ref: '#/components/schemas/AdditionalClaims'
        - type: object
#        CRID/Company are not currently returned.
#          properties:
#            company_name:
#              description: The name of the business that the user is affiliated with.
#              type: string
#              readOnly: true
#            crid:
#              $ref: '#/components/schemas/CRID'
#          additionalProperties: true
      additionalProperties: true
    DomesticAddress:
      title: Domestic Address
      additionalProperties: true
      description: Address fields for US locations
      readOnly: true
      allOf:
      - $ref: '#/components/schemas/Address'
      - type: object
        properties:
          city:
            maxLength: 28
            minLength: 1
            type: string
            description: This is the city name of the address.
          state:
            maxLength: 2
            minLength: 2
            pattern: ^(AA|AE|AL|AK|AP|AS|AZ|AR|CA|CO|CT|DE|DC|FM|FL|GA|GU|HI|ID|IL|IN|IA|KS|KY|LA|ME|MH|MD|MA|MI|MN|MS|MO|MP|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PW|PA|PR|RI|SC|SD|TN|TX|UT|VT|VI|VA|WA|WV|WI|WY)$
            type: string
            description: This is two-character state code of the address.
          ZIPCode:
            pattern: "\\d{5}"
            type: string
            description: This is the 5-digit ZIP code.
          ZIPPlus4:
            pattern: "\\d{4}"
            type: string
            description: This is the ZIP+4 extension.
            nullable: true
          urbanization:
            maxLength: 96
            type: string
            description: "An area, sector, or residential development within a geographic area (typically used for addresses in Puerto Rico)"
        additionalProperties: true
    Address:
      title: Address
      readOnly: true
      type: object
      properties:
        streetAddress:
          maxLength: 50
          minLength: 1
          type: string
          description: The number of a building along with the name of the road or street on which it is located.
        streetAddressAbbreviation:
          maxLength: 50
          minLength: 0
          type: string
          description: This is the abbreviation of street address line for the address.
          readOnly: true
        secondaryAddress:
          maxLength: 50
          type: string
          description: "The secondary unit designator, such as apartment(APT) or suite(STE) number, defining the exact location of the address within a building.  For more information please see [Postal Explorer](https://pe.usps.com/text/pub28/28c2_003.htm)."
        cityAbbreviation:
          type: string
          description: This is the abbreviation of city name for the address.
          readOnly: true
      additionalProperties: true
      description: Address fields standard to all locations.
      xml:
        name: Address
    CRID:
      title: Customer Registration Identifier
      description: A specific business location identified in a mailing.
      readOnly: true
      type: string
      minLength: 8
      maxLength: 16
      xml:
        name: CRID
      example:
        '12345678'
    Accounts:
      title: EPS Payment Accounts
      description: A list of EPS payment account identifiers.
      type: string
    Permits:
      title: Permit Numbers
      description: A list of permit numbers, each assigned to a ZIP code.
      type: array
      items:
        type: object
        properties:
          permitNumber:
            description: A permit number.
            type: string
          permitZIP:
            description: The ZIP code to which the permit is assigned.
            type: string
        additionalProperties: false        
        
    ErrorMessage:
      title: Error
      description: Standard error message response.
      type: object
      properties:
        apiVersion:
          type: string
          description: The version of the API that was used and that raised the error.
        error:
          type: object
          properties:
            code:
              type: string
              description: The error status code that has been returned in response to the request.
            message:
              type: string
              description: A human-readable message describing the error.
            errors:
              type: array
              items:
                type: object
                properties:
                  status:
                    type: string
                    description: The status code response returned to the client.
                  code:
                    type: string
                    description: An internal subordinate code used for error diagnosis.
                  title:
                    type: string
                    description: A human-readable title that identifies the error.
                  detail:
                    type: string
                    description: A human-readable description of the error that occurred.
                  source:
                    type: object
                    properties:
                      parameter:
                        type: string
                        description: The input in the request which caused an error.
                      example:
                        type: string
                        description: An example of a valid value for the input parameter.
                    additionalProperties: true
                    description: The element that is suspected of originating the error.  Helps to pinpoint the problem.
                additionalProperties: true
          additionalProperties: true
          description: The high-level error that has occurred as indicated by the status code.
      additionalProperties: true
 
 
  examples:

     userInfoJSONResponse:
       summary: JSON object response.
       description: The user's claims are included in the response body.
       value:
        {
            "sub": "1234567",
#            "given_name": "John",
#            "family_name": "Doe",
#            "preferred_username": "JDOE",
#            "address": 

---
openapi: 3.0.0
info:
  title: Userinfo (OAuth 2.0)
  description: |
  
    OpenID Connect 1.0 is a simple identity layer on top of the OAuth 2.0 protocol. It enables Clients to verify the identity of the End-User based on the authentication performed by an Authorization Server, as well as to obtain basic profile information about the End-User in an interoperable and REST-like manner.
    


    See the [OpenID Connect Core Specification](https://openid.net/specs/openid-connect-core-1_0.html) for more information.
    
    
    
    A set of claims is returned in a userInfo response.  A claim is a piece of information that is asserted about an entity, typically a user.  See [OpenID Connect Core Specification, Terminology](https://openid.net/specs/openid-connect-core-1_0.html#Terminology) for more information.
    
    
    
    A resource owner is an entity capable of granting access to a protected resource, typically a user.  See the [OAuth2 Authorization Framework Specification, Roles](https://datatracker.ietf.org/doc/html/rfc6749#section-1.1) for more information.
    
    
    
    
    The access token value is placed in the *Authorization* header in accordance with the *Bearer* authentication security scheme.

     ```
     Authorization: Bearer eyJhbGciOiJSUzI1NiJ9..qJ2SUGKn4TabFfMYODW1RLxirFmeeYPDyFvuJR0ywRVaRnoe7Rlk8yKM3v2fCBUi2lMo00whNhNWmqQktpGgvkVGWXGMNIlVxJCqt_aPFx3oOvkhKWGI49JI5NyXrpj4tfYD5pIYbrihkF7eMYG3XyqYMx1VLhhV0PmWhpq787K7_AGfRlNVQnD_WEHJt4SoEnsiw8vcwDWXcXr5yCzAEn8mfCSTlamqVBUyey1Fyg_xgQIRj_b9CO-O4kXsBM3vqo5CO2qET2tRd37niaQvV-g418sEpnw1iAtxWfcyU4IIjWlQa7AxAc3T4Vx6XOwn1CNI22ZhdaBskUtD-EexWQ

     ```

    
    You will need to get a new access token once the one you have has expired. It is best practice to get a new access token before expiration if further access to resources is needed.
    
    
    Each API will validate the access token, its expiration in addition to its OAuth scope for example. There may be further validations required which are specific to the resource being accessed.
    
    
    The userInfo API will validate the OAuth scope values which have been authorized for the client application to utilize during client registration. It will only include the claims which are mapped to the specific OAuth2 scope values in the response.
    
    ```
    | OAuth Scope          | Fields Included                                                |
    |----------------------|----------------------------------------------------------------|
    | openid               | OpenID Connect required to utilize this API                    |
    | usps:payment_methods | payment_accounts                                               |
    | usps:MIDs            | mail_owners                                                    |
    ```
    
    See also the authorization details for specific OAuth scope values.

# The following fields are not currently returned:
#    | profile              | given_name, family_name, preferred_username, company_name, crid|
#    | address              | street_address, secondary_address, city, state, ZIPCode        |
#    | email                | email, email_verified                                          |
#    | usps:contract_rates  | contracts                                                      |

